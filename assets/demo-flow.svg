<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PromptClip-Skill demo flow</title>
  <desc id="desc">A visual flow from raw clips and a prompt to a highlight reel and export artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="180" y1="120" x2="1020" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="132" x2="960" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>

  <text x="64" y="78" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">
    PromptClip-Skill
  </text>
  <text x="64" y="112" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500">
    Raw clips in, highlight reel out.
  </text>

  <rect x="60" y="150" width="1080" height="410" rx="28" fill="url(#panel)" stroke="#DBE3ED" filter="url(#shadow)"/>

  <!-- Left: source clips -->
  <g transform="translate(95 210)">
    <text x="0" y="-24" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">1. Raw clips</text>
    <rect x="0" y="0" width="250" height="260" rx="24" fill="#0F172A"/>
    <rect x="20" y="20" width="210" height="45" rx="14" fill="#1F2937"/>
    <rect x="20" y="80" width="210" height="45" rx="14" fill="#273449"/>
    <rect x="20" y="140" width="210" height="45" rx="14" fill="#334155"/>
    <rect x="20" y="200" width="210" height="40" rx="14" fill="#475569"/>
    <circle cx="55" cy="42" r="10" fill="#FB7185"/>
    <circle cx="55" cy="102" r="10" fill="#FBBF24"/>
    <circle cx="55" cy="162" r="10" fill="#22C55E"/>
    <circle cx="55" cy="220" r="10" fill="#38BDF8"/>
    <text x="80" y="48" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">clip_001.mp4</text>
    <text x="80" y="108" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">clip_002.mp4</text>
    <text x="80" y="168" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">clip_003.mp4</text>
    <text x="80" y="226" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">clip_004.mp4</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(385 295)">
    <rect x="0" y="0" width="120" height="12" rx="6" fill="url(#accent)"/>
    <path d="M120 6L102 -6V18L120 6Z" fill="#06B6D4"/>
  </g>

  <!-- Middle: prompt and analysis -->
  <g transform="translate(470 210)">
    <text x="0" y="-24" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">2. Prompt + analysis</text>
    <rect x="0" y="0" width="250" height="260" rx="24" fill="#EFF6FF" stroke="#BFDBFE"/>
    <rect x="22" y="24" width="206" height="56" rx="18" fill="#FFFFFF" stroke="#DBEAFE"/>
    <text x="40" y="47" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Keep clear expressions</text>
    <text x="40" y="67" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Complete actions. Share-ready.</text>
    <rect x="22" y="98" width="206" height="22" rx="11" fill="#22C55E" opacity=".18"/>
    <rect x="22" y="130" width="160" height="22" rx="11" fill="#06B6D4" opacity=".20"/>
    <rect x="22" y="162" width="190" height="22" rx="11" fill="#F59E0B" opacity=".18"/>
    <rect x="22" y="194" width="120" height="22" rx="11" fill="#8B5CF6" opacity=".18"/>
    <text x="22" y="244" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Codex sub-agents inspect bounded batches.</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(755 295)">
    <rect x="0" y="0" width="120" height="12" rx="6" fill="url(#accent)"/>
    <path d="M120 6L102 -6V18L120 6Z" fill="#06B6D4"/>
  </g>

  <!-- Right: output -->
  <g transform="translate(840 210)">
    <text x="0" y="-24" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">3. Highlight reel</text>
    <rect x="0" y="0" width="250" height="260" rx="24" fill="#0F172A"/>
    <rect x="20" y="22" width="210" height="132" rx="18" fill="#111827"/>
    <polygon points="111,68 111,106 148,87" fill="#E2E8F0"/>
    <rect x="20" y="170" width="210" height="16" rx="8" fill="#1F2937"/>
    <rect x="20" y="198" width="160" height="16" rx="8" fill="#334155"/>
    <rect x="20" y="226" width="190" height="16" rx="8" fill="#475569"/>
    <text x="22" y="58" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">highlight-reel.mp4</text>
    <text x="22" y="148" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">segments.json · timeline.fcpxml</text>
  </g>

  <g transform="translate(420 506)">
    <rect x="0" y="0" width="360" height="24" rx="12" fill="#E2E8F0"/>
    <rect x="16" y="4" width="82" height="16" rx="8" fill="#22C55E"/>
    <rect x="108" y="4" width="114" height="16" rx="8" fill="#38BDF8"/>
    <rect x="232" y="4" width="96" height="16" rx="8" fill="#F59E0B"/>
  </g>
  <text x="390" y="556" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
    Local-first. No source rewrite. Review before export.
  </text>
</svg>
